name: Validar catálogo documental
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/catalogo.py validar
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/catalogo.test.js
      - run: python tools/catalogo.py gerar --check
      - run: python tools/catalogo.py pacote
