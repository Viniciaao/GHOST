# Copie este arquivo para config.ini e preencha (opcional, só para Nexus/LoversLab/Baidu).
# NADA aqui é obrigatório para baixar MediaFire/Drive/ModBooru/gamer-mods.

# ---- Nexus Mods (para baixar via API; conta gratuita) -----------------------
# 1) Entre em https://www.nexusmods.com/users/myaccount?tab=api
# 2) Copie a "Personal API Key"
nexus_api_key=

# Cookies do navegador logado no nexusmods.com (se a API falhar):
# F12 -> Network -> copie cabeçalho "Cookie" de uma requisição para nexusmods.com
nexus_cookies=

# ---- LoversLab (para baixar arquivos 34130/34339/20287 etc.; conta gratuita) ----
# F12 -> Network -> copie o cabeçalho "Cookie" de qualquer requisição a loverslab.com
loverslab_cookies=

# ---- Baidu pan (chinês, opcional) -------------------------------------------
baidu_cookie=

# ---- Rede -------------------------------------------------------------------
timeout=60
retries=3
